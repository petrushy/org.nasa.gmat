  - name: tcsh
    buildsystem: autotools
    sources:
      - type: archive
        url: https://astron.com/pub/tcsh/tcsh-6.24.10.tar.gz
        sha256: 13475c0fbeb74139d33ed793bf00ffbbb2ac2dc9fb1d44467a410760aba36664

 
  - name: XercesC
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -Dnetwork-accessor=curl
      - -Dtranscoder=gnuiconv
    sources:
      - type: archive
        url: https://dlcdn.apache.org/xerces/c/3/sources/xerces-c-3.2.5.tar.gz
        sha256: 545cfcce6c4e755207bd1f27e319241e50e37c0c27250f11cda116018f1ef0f5
        x-checker-data:
          type: anitya
          project-id: 5182
          url-template: https://dlcdn.apache.org/xerces/c/3/sources/xerces-c-$version.tar.gz

  # cspice is distributed as a pre-compiled x86_64 Linux binary by NAIF/JPL.
  # aarch64 support would require building from source (NAIF does not publish an aarch64 build).
  - name: cspice
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - find . -type f -exec sed -i 's|#! /bin/csh|#! /app/bin/tcsh|' {} +
      - cd cspice && tcsh -e -f makeall.csh
      - 'find ./cspice/exe -type f -executable -exec install -Dm755 {} /app/bin/ \;'
      - 'find ./cspice/include -type f -exec install -Dm755 {} /app/include/ \;'
      - 'find ./cspice/lib -type f  -exec install -Dm755 {} /app/lib/ \;'  
    sources:
      - type: file
        url: https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z
        sha256: 60a95b51a6472f1afe7e40d77ebdee43c12bb5b8823676ccc74692ddfede06ce
      - type: shell
        commands:
          - gzip -d cspice.tar.Z
          - tar -xf cspice.tar

  - name: gmat
    buildsystem: cmake-ninja
    subdir: GMAT-R2026a
    build-options:
      env:
        LIBRARY_PATH: /app/lib:/usr/lib
        LD_LIBRARY_PATH: /app/lib:/usr/lib
        PATH: /app/bin:/usr/bin:/usr/lib/sdk/openjdk17/bin
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17

    build-commands:
      - install -Dm644 application/data/graphics/icons/GMATAboutIcon.png /app/share/icons/hicolor/256x256/apps/org.nasa.gmat.png

    config-opts:
      - -DCSPICE_DIR=/app
    sources:
      - type: file
        url: https://downloads.sourceforge.net/project/gmat/GMAT/GMAT-R2026a/GMAT-src_and_data-R2026a.zip
        sha256: 80b2a625111e5d8c90843a2d15fb718e0cb0b92e7516a2a7ce5596a55c6eac91
      - type: file
        url: https://gitlab.com/EmergentSpaceTechnologies/OpenFramesInterface/-/archive/R2025a_v1/OpenFramesInterface-R2025a_v1.tar.gz
        sha256: 5a9e372d6913b1a284f2d69a99ee826212abb38e07fd58042d9469dfcc2f4c67
      - type: shell
        commands:
          - unzip GMAT-src_and_data-R2026a.zip
          - tar -xvf OpenFramesInterface-R2025a_v1.tar.gz -C GMAT-R2026a
          # Fix GCC 15 buffer overflow: constName[400][6] has no null terminators,
          # strcpy reads past the 6-byte boundary. Use memcpy/memset instead.
          - sed -i 's/strcpy(label\[i\],"\\0");/memset(label[i], 0, 84);/g' GMAT-R2026a/src/base/solarsys/DeFile.hpp
          - sed -i 's/strcpy(constName\[i\],"\\0");/memset(constName[i], 0, 6);/g' GMAT-R2026a/src/base/solarsys/DeFile.hpp
          - sed -i 's/strcpy(label\[i\], r\.label\[i\]);/memcpy(label[i], r.label[i], 84);/g' GMAT-R2026a/src/base/solarsys/DeFile.hpp
          - sed -i 's/strcpy(constName\[i\],r\.constName\[i\]);/memcpy(constName[i], r.constName[i], 6);/g' GMAT-R2026a/src/base/solarsys/DeFile.hpp
          - cp GMAT-R2026a/application/data/graphics/icons/GMAT_logo.png GMAT-R2026a/application/data/graphics/icons/GMATWin32.ico
          - printf 'OpenFramesInterface = ../OpenFramesInterface-R2025a_v1\nOVtoOFI = OVtoOFI\n' > GMAT-R2026a/plugins/ListOfAdditionalPlugins.txt
          # Fix HiDPI quarter-screen OpenGL viewport bug: GetClientSize() returns logical pixels
          # but the GL framebuffer is physical pixels. Multiply by GetContentScaleFactor() (=2 on 200% displays).
          - sed -i 's/glViewport(0, 0, nWidth, nHeight);/glViewport(0, 0, (int)(nWidth*GetContentScaleFactor()), (int)(nHeight*GetContentScaleFactor()));/' GMAT-R2026a/src/gui/subscriber/ViewCanvas.cpp
          - sed -i 's/glViewport(0, 0, (GLint) nWidth, (GLint) nHeight);/glViewport(0, 0, (GLint)(nWidth*GetContentScaleFactor()), (GLint)(nHeight*GetContentScaleFactor()));/g' GMAT-R2026a/src/gui/subscriber/OrbitViewCanvas.cpp GMAT-R2026a/src/gui/subscriber/GroundTrackCanvas.cpp
          - sed -i 's/GLint h = GetSize().GetHeight();/GLint h = (GLint)(GetSize().GetHeight()*GetContentScaleFactor());/' GMAT-R2026a/src/gui/spacecraft/VisualModelCanvas.cpp
          - sed -i 's/GLint w = GetSize().GetWidth();/GLint w = (GLint)(GetSize().GetWidth()*GetContentScaleFactor());/' GMAT-R2026a/src/gui/spacecraft/VisualModelCanvas.cpp

  - name: gmat-config
    buildsystem: simple
    build-commands:
      - install -Dm644 gmat_startup_file.txt /app/bin/gmat_startup_file.txt
      - install -Dm644 org.nasa.gmat.desktop /app/share/applications/org.nasa.gmat.desktop
      - install -Dm644 org.nasa.gmat.metainfo.xml /app/share/metainfo/org.nasa.gmat.metainfo.xml
      - install -Dm755 gmat-launch.sh /app/bin/gmat-launch.sh

    sources:
      - type: file
        path: gmat_startup_file.txt
      - type: file
        path: org.nasa.gmat.desktop
      - type: file
        path: org.nasa.gmat.metainfo.xml
      - type: file
        path: gmat-launch.sh



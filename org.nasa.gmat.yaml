app-id: org.nasa.gmat

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: /app/bin/gmat-launch.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --env=TMPDIR=/var/tmp
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=OUTPUT_PATH=/var/tmp
  - --env=FLATPAK=1 
  - --env=GTK_USE_PORTAL=1
  # Make OSG find fonts bundled from the freedesktop runtime (arial.ttf alias + LiberationMono)
  - --env=OSG_FILE_PATH=/app/share/osg-fonts

platform-extensions: org.freedesktop.Platform.GL.default

add-extensions:
  org.freedesktop.Platform.GL.default:
    # directory: lib/extensions/GL
    versions: '25.08'
    subdirectories: true
    no-autodownload: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/aclocal
  - /share/bakefile
  # tcsh is only needed at build time (to run cspice's makeall.csh)
  - /bin/tcsh
  # Xerces-C CLI tools — only the shared library is needed at runtime
  - /bin/CreateDOMDocument
  - /bin/DOMCount
  - /bin/DOMPrint
  - /bin/EnumVal
  - /bin/MemParse
  - /bin/PParse
  - /bin/PSVIWriter
  - /bin/Redirect
  - /bin/SAX2Count
  - /bin/SAX2Print
  - /bin/SAXCount
  - /bin/SAXPrint
  - /bin/SCMPrint
  - /bin/SEnumVal
  - /bin/StdInParse
  - /bin/XInclude
  # Python dev/migration tools not needed at runtime
  - /bin/idle3.12
  - /bin/pydoc3.12
  - /bin/2to3-3.12
  # Python test suite and Python 2→3 migration library
  - /lib/python3.12/test
  - /lib/python3.12/lib2to3

modules:

  # - shared-modules/glu/glu-9.json
  # gtk3 is provided by the freedesktop 25.08 runtime; gtk2 is no longer needed
  # - shared-modules/gtk2/gtk2.json
  # - shared-modules/dbus-glib/dbus-glib.json
  - shared-modules/glew/glew.json



